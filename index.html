<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TechBar Signage</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

#sign {
  width: 100vw;
  height: 100vh;
  object-fit: fill;
}

/* Invisible click zone over UKG logo - bottom right */
#logoHotspot {
  position: fixed;
  right: 20px;
  bottom: 15px;
  width: 130px;
  height: 80px;
  cursor: pointer;
  z-index: 10;
}
</style>
</head>

<body>

<img id="sign" src="TechBarDaily.PNG">

<div id="logoHotspot" onclick="nextSign()"></div>

<script>
const slides = [
    "TechBarDaily.PNG",
    "TechBarLobby.PNG",
    "TeamMeeting.PNG",
    "TempClosed.PNG"
];

let currentSlide = 0;

function nextSign() {
  currentSlide = currentSlide + 1;

  if (currentSlide >= slides.length) {
    currentSlide = 0;
  }

  document.getElementById("sign").src = slides[currentSlide];
}
</script>

</body>
</html>
