<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TechBar Signage</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}
img {
  width: 100vw;
  height: 100vh;
  object-fit: fill;
}
</style>
</head>
<body>

<img id="sign">

<script>
const signs = {
  daily: "TechBarDaily.PNG",
  lobby: "TechBarLobby.PNG",
  meeting: "TeamMeeting.PNG",
  tempclosed: "TempClosed.PNG",
  walkupclosed: "WalkupClosediPad ON.PNG"
};

const params = new URLSearchParams(window.location.search);
const selected = params.get("sign") || "daily";

document.getElementById("sign").src = signs[selected] || signs.daily;
</script>

</body>
</html>
